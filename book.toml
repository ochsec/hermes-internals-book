[book]
title = "Hermes Agent Internals"
authors = ["ochsec"]
description = "A technical reference documenting the internal workings of the Hermes Agent framework."
src = "."

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
additional-css = ["theme/custom.css"]
git-repository-url = "https://github.com/ochsec/hermes-internals-book"
edit-url-template = "https://github.com/ochsec/hermes-internals-book/edit/main/{path}"
site-url = "/hermes-internals-book/"
